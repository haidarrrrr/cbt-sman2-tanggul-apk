name: Build APK CBT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: (Opsional) Pakai keystore dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CBT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CBT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Memakai keystore dari Secrets."
          else
            echo "Memakai keystore bawaan proyek (app/cbt-release.jks)."
          fi

      - name: Build APK
        env:
          CBT_KEYSTORE_PASS: ${{ secrets.CBT_KEYSTORE_PASS }}
          CBT_KEY_ALIAS: ${{ secrets.CBT_KEY_ALIAS }}
          CBT_KEY_PASS: ${{ secrets.CBT_KEY_PASS }}
        run: |
          # Secrets kosong dianggap tidak ada (pakai nilai default di app/build.gradle)
          [ -z "$CBT_KEYSTORE_PASS" ] && unset CBT_KEYSTORE_PASS
          [ -z "$CBT_KEY_ALIAS" ] && unset CBT_KEY_ALIAS
          [ -z "$CBT_KEY_PASS" ] && unset CBT_KEY_PASS
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk CBT-SMAN2-Tanggul.apk

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CBT-SMAN2-Tanggul-APK
          path: CBT-SMAN2-Tanggul.apk

      - name: Terbitkan sebagai Release (link unduh tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CBT SMAN 2 Tanggul v1.0.${{ github.run_number }}
          body: APK otomatis dari GitHub Actions. Unduh file CBT-SMAN2-Tanggul.apk di bawah.
          files: CBT-SMAN2-Tanggul.apk
          make_latest: true
